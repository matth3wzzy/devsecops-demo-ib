name: Advanced Security Pipeline
on: [push, pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Comprehensive Security Analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install security tools
      run: |
        pip install bandit semgrep
        echo "✅ Security tools installed: Bandit and Semgrep"
    
    - name: Run Bandit on all Python files (don't fail)
      run: |
        echo "🔍 Running Bandit - Comprehensive Python SAST..."
        bandit -r src/ -f json -o bandit-full-report.json || echo "⚠️ Bandit found vulnerabilities (expected - continuing)"
        echo "📊 Bandit analysis completed"
    
    - name: Show Bandit summary (SIMPLE VERSION)
      run: |
        echo "=== BANDIT SECURITY REPORT ==="
        echo ""
        
        # Простая проверка: если файл есть и не пустой
        if [ -s bandit-full-report.json ]; then
          echo "✅ VULNERABILITIES FOUND (as expected for demo):"
          echo ""
          
          # Просто показываем сколько нашлось уязвимостей
          COUNT=$(grep -o '"test_id"' bandit-full-report.json | wc -l)
          echo "Total issues found: $COUNT"
          echo ""
          
          # Простой вывод типов уязвимостей
          echo "Main vulnerability types detected:"
          grep '"test_id":' bandit-full-report.json | head -10 | sed 's/.*"test_id": "\([^"]*\)".*/- \1/' | sort | uniq
          echo ""
          
          echo "✅ This confirms our CI/CD pipeline is working!"
          echo "   Bandit successfully detected security issues in demo code."
        else
          echo "❌ No vulnerabilities found (unexpected for demo!)"
        fi
        
        echo ""
        echo "🎯 EXPECTED IN OUR DEMO CODE:"
        echo "   • SQL Injection vulnerabilities"
        echo "   • Command Injection issues"
        echo "   • Hardcoded secrets"
        echo "   • Security misconfigurations"

    - name: Run Semgrep with security rules
      run: |
        echo "🔍 Running Semgrep - Multi-language SAST..."
        semgrep scan \
          --config "p/security-audit" \
          --config "p/python" \
          --config "p/secrets" \
          --json -o semgrep-full-report.json || echo "⚠️ Semgrep found issues (expected - continuing)"
        echo "📊 Semgrep analysis completed"
    
    - name: Save comprehensive reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-comprehensive
        path: |
          bandit-full-report.json
          semgrep-full-report.json
    
    - name: Final report
      run: |
        echo "================================================"
        echo "✅ ADVANCED SECURITY PIPELINE - SUCCESS"
        echo "================================================"
        echo "📊 RESULTS:"
        echo "   • Bandit: Completed security scan"
        echo "   • Semgrep: Completed security scan"
        echo "   • Reports: Saved as artifacts"
        echo ""
        echo "🔍 FILES ANALYZED:"
        for file in src/*.py; do
          if [ -f "$file" ]; then
            echo "   • $(basename "$file")"
          fi
        done
        echo ""
        echo "✅ DEMONSTRATION SUCCESSFUL"
        echo "   Automatic vulnerability detection: ✓ WORKING"
        echo "   CI/CD pipeline integration: ✓ WORKING"
        echo "================================================"