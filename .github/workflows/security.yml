'EOF'
name: Advanced Security Pipeline
on: [push, pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Comprehensive Security Analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install security tools
      run: |
        pip install bandit semgrep
        echo "Security tools installed: Bandit and Semgrep"
    
    - name: Run Bandit on all Python files
      run: |
        echo "Running Bandit - Comprehensive Python SAST..."
        bandit -r src/ -f json -o bandit-full-report.json
        echo "Bandit analysis completed"
    
    - name: Show Bandit summary
      run: |
        echo "=== BANDIT SECURITY REPORT SUMMARY ==="
        python3 << 'PYSCRIPT'
import json
try:
    with open('bandit-full-report.json') as f:
        data = json.load(f)
    
    issues = data.get('results', [])
    print(f'Total issues found: {len(issues)}')
    
    # Group by vulnerability type
    vuln_types = {}
    for issue in issues:
        test_name = issue.get('test_name', 'Unknown')
        vuln_types[test_name] = vuln_types.get(test_name, 0) + 1
    
    print('\nBreakdown by vulnerability type:')
    for vuln_type, count in sorted(vuln_types.items()):
        print(f'  • {vuln_type}: {count} issues')
    
    print('\nExpected vulnerabilities in demo code:')
    print('   • SQL Injection (B608, B607)')
    print('   • Command Injection (B602, B604)')
    print('   • Hardcoded Secrets (B105, B106, B107)')
    print('   • Insecure Deserialization (B403)')
    print('   • Weak Cryptography (B303, B304)')
    
except Exception as e:
    print(f'Error reading report: {e}')
PYSCRIPT
    
    - name: Run Semgrep with security rules
      run: |
        echo "Running Semgrep - Multi-language SAST..."
        semgrep scan \
          --config "p/security-audit" \
          --config "p/python" \
          --config "p/secrets" \
          --json -o semgrep-full-report.json
        echo "Semgrep analysis completed"
    
    - name: Save comprehensive reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports-comprehensive
        path: |
          bandit-full-report.json
          semgrep-full-report.json
    
    - name: Final report
      run: |
        echo "================================================"
        echo "ADVANCED SECURITY PIPELINE COMPLETED"
        echo "================================================"
        echo "Reports saved as artifacts:"
        echo "   • bandit-full-report.json"
        echo "   • semgrep-full-report.json"
        echo ""
        echo "Files analyzed:"
        echo "   • src/app.py (basic vulnerabilities)"
        echo "   • src/vulnerable_app.py (10 vulnerability types)"
        echo ""
        echo "This demonstrates:"
        echo "   • Real-world vulnerability detection"
        echo "   • Multi-file analysis capability"
        echo "   • Professional security tooling"
        echo "   • Ready-for-production CI/CD pipeline"
        echo "================================================"
EOF